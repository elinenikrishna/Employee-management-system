spring:
  application:
    name: employee-management-system
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ems_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true}
    username: ${DB_USERNAME:ems_user}
    password: ${DB_PASSWORD:ems_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 1000
        order_inserts: true
        order_updates: true
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
app:
  data-loader:
    enabled: ${DATA_LOADER_ENABLED:false}
    target-count: ${DATA_LOADER_TARGET_COUNT:0}
    batch-size: ${DATA_LOADER_BATCH_SIZE:5000}
