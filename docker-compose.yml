services:
  mysql:
    image: mysql:8.4
    container_name: ems-mysql
    environment:
      MYSQL_DATABASE: ems_db
      MYSQL_USER: ems_user
      MYSQL_PASSWORD: ems_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    command: ["--innodb_buffer_pool_size=1G", "--max_connections=300", "--local_infile=1"]
    volumes:
      - ems_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: ems-api
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:mysql://mysql:3306/ems_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true
      DB_USERNAME: ems_user
      DB_PASSWORD: ems_password
    ports:
      - "8080:8080"

volumes:
  ems_mysql_data:
